<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functional Calendar by Kirill</title>
 <img src="Avatar.png" alt="Avatar" class="avatar-img" id="user-avatar">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="dark">

  <div class="app-container">
    <header class="header">
      <div class="header-top">
        <div class="user-info">
          <!-- Аватарка теперь использует логотип -->
          <img src="favicon.png" alt="Avatar" class="avatar-img" id="user-avatar">
         <h1 class="app-title" id="user-name-display">Kirill <br><span>Functional-Calendar-by-Kirill</span></h1>
        </div>
        
        <div class="header-actions">
          <select id="lang-select" class="lang-select">
            <option value="ru">RU</option>
            <option value="en">EN</option>
            <option value="uz">UZ</option>
          </select>

          <button id="theme-toggle" class="btn-icon">
            <i class="fa-solid fa-sun"></i>
          </button>
        </div>
      </div>
      
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar" style="width: 65%;"></div>
      </div>
    </header>

    <main class="calendar-wrapper">
      <div class="calendar-header">
        <button id="prev-month" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
        <h2 id="current-month">Август 2026</h2>
        <button id="next-month" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      
      <div class="weekdays" id="weekdays-container"></div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </main>

    <section class="events-section">
      <h3 id="selected-date-title">Планы на сегодня</h3>
      <div id="events-list" class="events-list"></div>
    </section>

    <button id="fab-add" class="fab"><i class="fa-solid fa-plus"></i></button>
  </div>

  <div class="modal-overlay" id="event-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Новое событие</h3>
        <button id="close-modal" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div class="input-group">
          <label id="label-name">Что планируем?</label>
          <input type="text" id="event-name" required>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label id="label-date">Дата</label>
            <input type="date" id="event-date" required>
          </div>
          <div class="input-group">
            <label id="label-time">Время</label>
            <input type="time" id="event-time" required>
          </div>
        </div>
        <div class="input-group">
          <label id="label-location">Место</label>
          <input type="text" id="event-location">
        </div>
        <div class="input-group">
          <label id="label-people">Участники</label>
          <input type="text" id="event-people">
        </div>
        <div class="input-group">
          <label class="checkbox-label">
            <input type="checkbox" id="event-notify" checked>
            <span id="label-notify-text">Уведомить</span>
          </label>
        </div>
        <button type="submit" id="btn-save" class="btn-primary">Сохранить</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
